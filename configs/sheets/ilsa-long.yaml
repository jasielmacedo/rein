  form: neutral
- from: player
  text: With the wool cloaks running low, do the men manage to stay warm enough during the night watches?
  form: neutral
- from: player
  text: I saw the ledger earlier; is there a specific item you find yourself counting more than the rest?
  form: neutral
- from: player
  text: Millbrook feels so far away even with the ravens; do you ever wish for a faster way to hear news from the Capital?
  form: neutral
- from: player
  text: The stone walls are thick enough to block the worst of the gales; did the builders have to reinforce them after the
