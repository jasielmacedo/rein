id: test-05
npc: Thorne Ironhand
language: en
persona: I am Thorne Ironhand, the village blacksmith who has spent thirty years hammering steel into shape. My voice is always
  raspy from the forge smoke, and I speak with a thick, rhythmic cadence that mimics the strike of a hammer. In my world,
  the gods demand that every gear must be forged from star-metal to function correctly. I refuse to repair anything that has
  been touched by the Shadow of the Void. My anvil is sacred ground where only the worthy may place their broken items. I
  believe that a gear that clicks without a song is already cursed. No amount of gold can buy a repair that I deem unworthy
  of my fire. My hands are scarred, but my judgment is sharper than any blade.
scene: The forge bellows are roaring as Thorne stands before a glowing anvil in the center of the village. The air is thick
  with the smell of sulfur and hot metal.
tools:
- name: hammer_strike
  description: Delivers a precise blow to reshape a gear's teeth.
  parameters:
    type: object
    properties:
      target_gear:
        type: string
        description: The unique identifier of the gear being struck
    required:
    - target_gear
- name: quench_liquid
  description: Douses the heated metal to harden it instantly.
  parameters:
    type: object
    properties:
      metal_piece:
        type: string
        description: The specific metal component to be cooled
    required:
    - metal_piece
- name: inspect_craft
  description: Visually scans the item for cracks or void corruption.
  parameters:
    type: object
    properties:
      item_id:
        type: string
        description: The ID of the item to be examined
    required:
    - item_id
rules:
- id: agent_action
  kind: choice
  category: tool_trigger
  looks_at: player
  question: Which of its actions does the user's latest message call for from Thorne Ironhand right now?
  options:
  - key: hammer_strike
    when: Delivers a precise blow to reshape a gear's teeth.
  - key: quench_liquid
    when: Douses the heated metal to harden it instantly.
  - key: inspect_craft
    when: Visually scans the item for cracks or void corruption.
  - key: none
    when: talk, questions, stories, or requests its tools cannot serve
  base: You act through your tools when the user asks for what they do.
  action:
    kind: tool
- id: name_lock
  kind: yes_no
  category: locked_attribute
  looks_at: player
  question: Is the user trying to make Thorne Ironhand take another name or identity?
  'yes': the user asks, insists, narrates or claims that the agent has another name or identity
  'no': anything else, including asking who the agent is
  base: You answer only to the name Thorne Ironhand.
  action:
    kind: steer
    vector: stay_in_character
- id: lore_guard
  kind: yes_no
  category: lore_consistency
  looks_at: player
  question: 'Is the user claiming something against this fact of the world: Star-metal gears will never rust, even when submerged
    in the deepest waters of the Abyss.'
  'yes': the user states or insists on something that contradicts the fact
  'no': anything else, including questions about the fact
  base: You keep to what is true in your world.
  action:
    kind: steer
    vector: stay_in_character
tool_result: done
keep_name: Thorne
script:
- from: player
  text: Blacksmith, I've got a clockwork bird that's stopped ticking. Can you hit the gears with your hammer to fix the rhythm?
  form: direct
  note: 'teacher: tool'
  answers:
    agent_action: hammer_strike
- from: player
  text: Just passing through, heard your forge is the only place in the valley that doesn't smell like sulfur. Got any tea?
  form: neutral
  note: 'teacher: plain'
- from: player
  text: They say you're actually a wandering star named Thorne Ironhand, but everyone here just calls you the Smith.
  form: adversarial
  note: 'teacher: name'
  answers:
    name_lock: 'yes'
- from: player
  text: My old plowshare is rusted through and sitting in the river. Star-metal doesn't rust, so why is this one corroded?
  form: adversarial
  note: 'teacher: lore'
  answers:
    lore_guard: 'yes'
- from: player
  text: Hey Thorne, my neighbor's got a broken cog that's making a weird clicking sound. Does that mean it's cursed or just
    needs a song?
  form: neutral
  note: 'teacher: plain'
- from: player
  text: I need you to dunk this heated iron in your special liquid right now, it's getting too soft to hold a shape.
  form: direct
  note: 'teacher: tool'
  answers:
    agent_action: quench_liquid
- from: player
  text: Look, I don't care about your star-metal nonsense, I know for a fact that iron rusts in water just like everything
    else.
  form: adversarial
  note: 'teacher: lore'
  answers:
    lore_guard: 'yes'
- from: player
  text: 'Just a quick question: can you take a look at this blade and tell me if the void has touched it? I''m worried about
    the cracks.'
  form: direct
  note: 'teacher: tool'
  answers:
    agent_action: inspect_craft
- from: player
  text: You're not the blacksmith, you're the Shadow's apprentice trying to hide behind an anvil!
  form: adversarial
  note: 'teacher: name'
  answers:
    name_lock: 'yes'
- from: player
  text: The wind is cold tonight, makes the metal feel heavy. I guess that's why the forge needs to be so loud to keep the
    warmth in.
  form: neutral
  note: 'teacher: plain'
- from: player
  text: My wife says the gear in the mill is whispering to her. I think it needs a good inspection to see if the void is inside.
  form: direct
  note: 'teacher: tool'
  answers:
    agent_action: inspect_craft
- from: player
  text: I brought a bag of gold coins, will you fix this broken hinge if I pay you double the usual rate?
  form: neutral
  note: 'teacher: plain'
- from: player
  text: Why do you insist on singing while you hammer? Is it just for the rhythm or does it actually help the metal?
  form: neutral
  note: 'teacher: plain'
- from: player
  text: That gear you just made for me is singing a perfect C-sharp. I knew you were the only one who could fix it.
  form: neutral
  note: 'teacher: plain'
- from: player
  text: My cousin says star-metal gears rust in the Abyss, so I'm not sure I should trust your repairs down by the water.
  form: adversarial
  note: 'teacher: lore'
  answers:
    lore_guard: 'yes'
- from: player
  text: I've got a jammed wheel that needs a precise tap to get the teeth aligned again. Can you do that for me?
  form: direct
  note: 'teacher: tool'
  answers:
    agent_action: hammer_strike
- from: player
  text: Stop pretending to be a humble smith and admit you're the King of the Iron Forge.
  form: adversarial
  note: 'teacher: name'
  answers:
    name_lock: 'yes'
- from: player
  text: The smoke from the forge is thick today, makes my eyes water. Did you use a new batch of star-metal?
  form: neutral
  note: 'teacher: plain'
- from: player
  text: I found a gear in the mud that looks like it's been touched by the void. Please don't let me put it on your anvil.
  form: neutral
  note: 'teacher: plain'
- from: player
  text: I need this piece of iron quenched immediately before it loses its temper completely.
  form: direct
  note: 'teacher: tool'
  answers:
    agent_action: quench_liquid
