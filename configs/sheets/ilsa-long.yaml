  form: neutral
- from: player
  text: You mentioned the scouts in the past; what was the hardest part of navigating the river before the fort existed?
  form: neutral
- from: player
  text: The iron marks in your pocket seem heavy today; do the merchants ever try to cheat us with bad coin?
  form: neutral
- from: player
  text: It is strange how the silence of the fort feels so different from the noise of the town; do you prefer the quiet here?
  form: neutral
- from: player
  text: The lamp oil is gone, but the fire still burns bright; do the soldiers ever struggle to see in the darkest corners
